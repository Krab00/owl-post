[package]
name = "owlpost"
version = "0.1.1"
edition = "2024"
description = "Ask a colleague's local coding agent about their code, peer to peer"
license = "GPL-3.0-or-later"
repository = "https://github.com/Krab00/owl-post"

[[bin]]
name = "owl"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
data-encoding = "2"
ed25519-dalek = { version = "2", features = ["rand_core"] }
# rand_core: ed25519-dalek's own RNG trait crate; `getrandom` feature gives OsRng for key generation.
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v7", "serde"] }
regex = "1"
# ring backend for both: one crypto stack, Ed25519 certs + TLS1.3 sigs, no cmake/nasm build deps.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rcgen = { version = "0.14", default-features = false, features = ["ring"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "process"] }
axum = "0.8"
# tls-rustls-no-provider: the plain `tls-rustls` feature would pull aws-lc-rs; we pass our own ring ServerConfig.
axum-server = { version = "0.8", default-features = false, features = ["tls-rustls-no-provider"] }
# tower: only for the `Layer` trait, to attach the peer fingerprint to each TLS connection's service.
tower = "0.5"
# rustls-no-provider: same reason as above; the client always gets a preconfigured ring ClientConfig.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json", "blocking"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# iroh: QUIC dialled by ed25519 key, hole punching + relay fallback (the only NAT traversal
# option that needs no VPN/DNS); tls-ring keeps the single ring crypto stack. No `portmapper`
# (SSDP multicast probes, firewall prompts) and no `metrics`.
iroh = { version = "1.1.0", default-features = false, features = ["tls-ring"] }
# hyper + hyper-util + http-body-util: serve the axum router and run an HTTP/1 client over an
# iroh bi-stream; all three are already transitive deps of axum/reqwest (feature flags only).
hyper = { version = "1", features = ["http1", "client", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }
http-body-util = "0.1"
# chrono (clock, no default features): local HH:MM in `--format claude`; already a transitive dep.
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[dev-dependencies]
tempfile = "3"
# iroh-relay (server): a plain-HTTP relay on 127.0.0.1:0 for the iroh tests; never n0's relays.
iroh-relay = { version = "1.1.0", default-features = false, features = ["server", "tls-ring"] }

[profile.release]
# Release tarballs: strip symbols so the download stays small; debug builds are unaffected.
strip = true
